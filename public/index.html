<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Campus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4;--surface:#fff;--surface2:#F4F6F9;--ink:#1B2540;--muted:#566280;--line:#D9DFE8;
  --brand:#0E7C86;--brand-soft:#D8EFF1;--brand-ink:#fff;
  --amber:#B76E00;--amber-soft:#FBEBCF;--red:#B8402B;--red-soft:#F8DDD7;
  --green:#22784A;--green-soft:#D9EFE2;--blue:#2F5FC4;--blue-soft:#DCE6F8;--grey-soft:#E6EAF0;
  --side:#16203A;--shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.05);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424;--surface:#16203A;--surface2:#1B2745;--ink:#E7ECF6;--muted:#9AA7C2;--line:#2A3657;
    --brand:#3DB8C2;--brand-soft:#173A47;--brand-ink:#08222A;
    --amber:#F0B25A;--amber-soft:#3A2F1A;--red:#F08A74;--red-soft:#43221D;
    --green:#5CC48C;--green-soft:#173A29;--blue:#86A9F2;--blue-soft:#1D2E55;--grey-soft:#242F4D;--side:#0A1020;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424;--surface:#16203A;--surface2:#1B2745;--ink:#E7ECF6;--muted:#9AA7C2;--line:#2A3657;
  --brand:#3DB8C2;--brand-soft:#173A47;--brand-ink:#08222A;
  --amber:#F0B25A;--amber-soft:#3A2F1A;--red:#F08A74;--red-soft:#43221D;
  --green:#5CC48C;--green-soft:#173A29;--blue:#86A9F2;--blue-soft:#1D2E55;--grey-soft:#242F4D;--side:#0A1020;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.55 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:700}h2{font-size:1.15rem;font-weight:700}h3{font-size:1rem;font-weight:700}
p{margin:0}a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:4px}
.muted{color:var(--muted)}.small{font-size:.85rem}.grow{flex:1}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.side{background:var(--side);color:#C9D2E6;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:1.1rem .8rem;display:flex;flex-direction:column;gap:.2rem;z-index:30}
.brand{display:flex;align-items:center;gap:.6rem;padding:.2rem .5rem 1rem;color:#fff;font:700 1.05rem 'Bricolage Grotesque',sans-serif}
.brand .mark{width:30px;height:30px;border-radius:8px;background:#3DB8C2;color:#08222A;display:grid;place-items:center}
.side h4{margin:.9rem .6rem .25rem;font-size:.8rem;font-weight:500;color:#8593B3}
.side a.nav{display:flex;gap:.65rem;align-items:center;padding:.55rem .65rem;border-radius:8px;color:#C9D2E6;font-weight:500}
.side a.nav:hover{background:rgba(255,255,255,.07);text-decoration:none}
.side a.nav[aria-current="page"]{background:#3DB8C2;color:#08222A}
.side-foot{margin-top:auto;padding:.8rem .5rem 0;border-top:1px solid rgba(255,255,255,.1);display:flex;gap:.6rem;align-items:center}
.side-foot b{display:block;color:#fff;font-size:.9rem}.side-foot small{color:#8593B3}
.content{display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:.6rem;padding:.65rem 1.4rem;background:var(--bg);border-bottom:1px solid var(--line)}
.crumb{color:var(--muted);font-size:.9rem}.crumb b{color:var(--ink);font-weight:600}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.icon-btn:hover{background:var(--surface2)}
.menu{display:none}
.dot{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:.72rem;font-weight:600;display:grid;place-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:600;font-size:.85rem;flex:none}
main{padding:1.5rem 1.4rem 3rem;max-width:1180px;width:100%;margin:0 auto;outline:none}
.scrim{display:none}
.bell-wrap{position:relative}
.drop{position:absolute;right:0;top:46px;width:min(360px,88vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(10,20,50,.25);z-index:40;overflow:hidden}
.drop header{display:flex;justify-content:space-between;align-items:center;padding:.7rem .9rem;border-bottom:1px solid var(--line)}
.drop footer{padding:.6rem .9rem;border-top:1px solid var(--line);text-align:center}
.n-item{display:block;padding:.65rem .9rem;color:var(--ink);border-bottom:1px solid var(--line)}
.n-item:hover{background:var(--surface2);text-decoration:none}
.n-item.unread{background:var(--brand-soft)}
.n-item small{color:var(--muted)}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.1rem;box-shadow:var(--shadow)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}
.head p{margin-top:.3rem;max-width:62ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.55rem .95rem;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface2);text-decoration:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red)}
.btn.sm{padding:.3rem .65rem;font-size:.88rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;padding:.12rem .55rem;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap}
.badge.grey{background:var(--grey-soft);color:var(--muted)}.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}.badge.green{background:var(--green-soft);color:var(--green)}
.badge.red{background:var(--red-soft);color:var(--red)}.badge.teal{background:var(--brand-soft);color:var(--brand)}
.grid{display:grid;gap:1rem}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.stat b{display:block;font:700 2rem 'Bricolage Grotesque',sans-serif;line-height:1.1;margin:.25rem 0}
.stat span{color:var(--muted);font-size:.9rem}.stat small{color:var(--muted)}
.stat.warn b{color:var(--red)}.stat.good b{color:var(--green)}
.field{display:block;margin-bottom:.9rem}
.field>span{display:block;font-weight:500;margin-bottom:.3rem;font-size:.92rem}
.field input,.field select,.field textarea,.filters input,.filters select{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:9px;background:var(--surface);min-height:40px}
.field textarea{min-height:100px;resize:vertical}
.field [aria-invalid="true"]{border-color:var(--red)}
.err{display:block;color:var(--red);font-size:.84rem;min-height:1.1em;margin-top:.2rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.filters{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem;padding:.75rem}
.filters input{flex:2 1 220px;width:auto}.filters select{flex:1 1 160px;width:auto}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-weight:600;font-size:.85rem;color:var(--muted);padding:.65rem .8rem;border-bottom:1px solid var(--line);background:var(--surface2)}
td{padding:.65rem .8rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.pager{display:flex;gap:.8rem;align-items:center;justify-content:center;margin-top:1rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:1rem}
.item h3 a{color:var(--ink)}
.item .meta{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}
.empty{text-align:center;padding:2.5rem 1rem;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.empty h3{margin-bottom:.3rem}.empty .btn{margin-top:1rem}
.loader{display:flex;gap:.7rem;align-items:center;justify-content:center;padding:4rem 0;color:var(--muted)}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:.8rem;justify-content:space-between;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list a.t{color:var(--ink);font-weight:500}
.list small{color:var(--muted)}
.sect{margin:1.6rem 0 .7rem}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.tl li{position:relative;text-align:center;padding-top:34px;font-size:.88rem}
.tl li::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--line)}
.tl li:first-child::before{display:none}
.tl li.done::before,.tl li.now::before{background:var(--brand)}
.tl .node{position:absolute;top:2px;left:calc(50% - 12px);width:25px;height:25px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;color:var(--brand-ink)}
.tl li.done .node{background:var(--brand);border-color:var(--brand)}
.tl li.now .node{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.tl .node .i{width:13px;height:13px;stroke-width:3}
.tl b{display:block}.tl small{color:var(--muted)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:.45rem 1rem;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.thumbs{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
.thumbs div{position:relative}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer;line-height:1}
.note{padding:.6rem .8rem;background:var(--surface2);border-radius:9px;margin-bottom:.5rem}
.note small{color:var(--muted)}

/* map */
svg.campus{width:100%;height:auto;display:block;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
svg.campus.pick{cursor:crosshair}
.campus .road{stroke:var(--line);stroke-width:14;fill:none;stroke-linecap:butt}
.campus .blk{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.campus .heat{fill:var(--brand)}
.campus text{fill:var(--ink);font-size:11.5px;font-family:'IBM Plex Sans',sans-serif;pointer-events:none}
.campus text.sub{fill:var(--muted);font-size:10.5px}
.legend{display:flex;gap:.5rem;align-items:center;font-size:.82rem;color:var(--muted);margin-top:.5rem}
.legend i{display:inline-block;width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--surface2),var(--brand))}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:'IBM Plex Sans',sans-serif}
.chart .ln{fill:none;stroke:var(--brand);stroke-width:2.5}
.chart .ar{fill:var(--brand);opacity:.14}
.chart .pt{fill:var(--surface);stroke:var(--brand);stroke-width:2}
.hbar{display:grid;grid-template-columns:130px 1fr 54px;gap:.6rem;align-items:center;margin:.45rem 0;font-size:.9rem}
.hbar .track{height:12px;border-radius:6px;background:var(--grey-soft);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--brand);border-radius:6px}
.hbar b{text-align:right;font-weight:600}
.score{display:flex;gap:.6rem;align-items:center}
.score .track{flex:1;height:10px;border-radius:6px;background:var(--grey-soft);overflow:hidden}
.score i{display:block;height:100%;background:var(--green)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:.8rem 0}
.pair>div{background:var(--surface2);border-radius:10px;padding:.7rem .85rem}
.tabs{display:flex;gap:.4rem;margin-bottom:1rem;flex-wrap:wrap}
.tabs .btn[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* toasts + modal */
#toasts{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));display:grid;gap:.5rem;z-index:100;max-width:min(380px,92vw)}
.toast{background:var(--ink);color:var(--bg);padding:.7rem .95rem;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.28);animation:in .25s ease-out;border-left:5px solid var(--brand)}
.toast.ok{border-color:var(--green)}.toast.warn{border-color:#E9A23B}.toast.bad{border-color:var(--red)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.backdrop{position:fixed;inset:0;background:rgba(8,14,30,.55);display:grid;place-items:center;z-index:90;padding:1rem}
.modal{background:var(--surface);border-radius:14px;padding:1.3rem;width:min(520px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line)}
.modal header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.modal textarea{width:100%;min-height:200px;font-family:monospace;font-size:.82rem}

/* auth */
.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.hero{background:var(--side);color:#fff;padding:2.5rem;display:flex;flex-direction:column;justify-content:center;gap:1.4rem}
.hero h1{font-size:clamp(2rem,4vw,3rem);max-width:14ch}
.hero p{color:#B4C0DA;max-width:44ch}
.hero svg.campus{background:#0E1730;border-color:#27355B}
.hero .campus .blk{fill:#16203A;stroke:#2E3D66}
.hero .campus .road{stroke:#1F2B4D}
.hero .campus text{fill:#AEBBDA}
.hero .pin{animation:drop .7s cubic-bezier(.3,1.5,.5,1) both}
.hero .pin:nth-of-type(2){animation-delay:.25s}.hero .pin:nth-of-type(3){animation-delay:.5s}.hero .pin:nth-of-type(4){animation-delay:.75s}
@keyframes drop{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:none}}
.formside{display:grid;place-items:center;padding:2rem 1.2rem}
.formbox{width:min(420px,100%)}
.formbox h1{margin-bottom:.4rem}.formbox form{margin-top:1.2rem}
.demo{margin-top:1.4rem;padding-top:1rem;border-top:1px solid var(--line)}
.demo p{margin-bottom:.5rem;color:var(--muted);font-size:.9rem}
.alt{display:flex;justify-content:space-between;margin-top:1.2rem;font-size:.92rem}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);height:auto;width:270px;transform:translateX(-102%);transition:transform .2s}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(8,14,30,.5);z-index:25}
  .menu{display:inline-grid}
  .auth{grid-template-columns:1fr}.hero{padding:1.5rem}.hero svg.campus{display:none}
  .two,.pair{grid-template-columns:1fr}
  .top,main{padding-left:1rem;padding-right:1rem}
  .tl{grid-template-columns:1fr;gap:.9rem}
  .tl li{text-align:left;padding:0 0 0 38px;min-height:30px}
  .tl li::before{display:none}.tl .node{left:0;top:0}
  .hbar{grid-template-columns:100px 1fr 48px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<div id="modal"></div>

<script>
(function(){
'use strict';

/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const NOW=Date.now(),DAY=864e5;
const ago=d=>new Date(NOW-d*DAY).toISOString();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate=iso=>{const d=new Date(iso);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
const rel=iso=>{const m=(Date.now()-new Date(iso))/6e4;if(m<1)return 'just now';if(m<60)return Math.floor(m)+' min ago';const h=m/60;if(h<24)return Math.floor(h)+' h ago';const d=h/24;if(d<30)return Math.floor(d)+' d ago';return fmtDate(iso)};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const ICONS={
home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',alert:'<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18v.01"/>',
plus:'<path d="M12 5v14M5 12h14"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
bell:'<path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 004 0"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7M18 15c2.5.6 4 2.3 4 5"/>',
chart:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>',wrench:'<path d="M14 7a4 4 0 005 5l-9 9a2.8 2.8 0 01-4-4l9-9z"/>',
tag:'<path d="M3 12V3h9l9 9-9 9-9-9z"/><path d="M7.5 7.5h.01"/>',file:'<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/>',
check:'<path d="M5 12l5 5 9-10"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
moon:'<path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/>',menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',logout:'<path d="M9 21H4V3h5M16 17l5-5-5-5M21 12H9"/>',
pin:'<path d="M12 21s7-6 7-12a7 7 0 10-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>',layers:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>'};

/* ---------- data (loaded from the API) ---------- */

 f:{complaints:{q:'',status:'',priority:'',category:''},mine:{q:'',status:'',priority:'',category:''},lost:{q:'',category:''},found:{q:'',category:''},tasks:{status:''},notifs:{unread:''},matches:{tab:'pending'}}};

/* ---------- domain helpers ---------- */
const uname=id=>(users.find(u=>u.id===id)||{name:'Unknown'}).name;
const resDays=c=>{const r=c.history.find(h=>h.status==='Resolved');return r?(new Date(r.at)-new Date(c.created))/DAY:null};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function computeMatches(){return S.matches.map(m=>({key:m.key,l:lost.find(x=>x.id===m.lostId),f:found.find(x=>x.id===m.foundId),s:m.s,why:m.why})).filter(m=>m.l&&m.f)}

/* ---------- ui bits ---------- */
const TONE={Submitted:'grey',Assigned:'amber','In Progress':'blue',Resolved:'green',Closed:'grey',Low:'grey',Medium:'blue',High:'amber',Urgent:'red',Open:'blue',Matched:'amber','Claim pending':'amber',Recovered:'green',Returned:'green'};
const bd=t=>`<span class="badge ${TONE[t]||'grey'}">${esc(t)}</span>`;
const head=(t,sub,act)=>`<div class="head"><div><h1>${esc(t)}</h1>${sub?`<p class="muted">${esc(sub)}</p>`:''}</div><div class="row">${act||''}</div></div>`;
const empty=(t,b,a)=>`<div class="empty"><h3>${esc(t)}</h3><p class="muted">${esc(b)}</p>${a||''}</div>`;
const loader=()=>`<div class="loader" role="status"><span class="spin"></span>Loading…</div>`;
const stat=(l,v,n,tone)=>`<div class="card stat ${tone||''}"><span>${esc(l)}</span><b>${v}</b><small>${esc(n||'')}</small></div>`;
const tableHTML=(h,rows)=>`<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
function fld(name,label,type,o={}){return `<label class="field"><span>${label}</span><input name="${name}" type="${type}" placeholder="${esc(o.ph||'')}" autocomplete="${o.auto||'off'}" value="${esc(o.val||'')}" ${o.max?`max="${o.max}"`:''}><small class="err" data-err="${name}" role="alert"></small></label>`}
function ta(name,label,ph,val){return `<label class="field"><span>${label}</span><textarea name="${name}" placeholder="${esc(ph||'')}">${esc(val||'')}</textarea><small class="err" data-err="${name}" role="alert"></small></label>`}
function sel(name,label,opts,val,ph){return `<label class="field"><span>${label}</span><select name="${name}">${ph?`<option value="">${esc(ph)}</option>`:''}${opts.map(o=>{const v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return `<option value="${esc(v)}" ${v===val?'selected':''}>${esc(t)}</option>`}).join('')}</select><small class="err" data-err="${name}" role="alert"></small></label>`}
function toast(msg,type){const t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),4200)}
function openModal(title,html){$('#modal').innerHTML=`<div class="backdrop" data-action="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="icon-btn" data-action="modal-close" aria-label="Close">${ico('x')}</button></header>${html}</div></div>`;const f=$('#modal input,#modal textarea,#modal select');if(f)f.focus()}
const closeModal=()=>{$('#modal').innerHTML=''};
function paged(list,key,size){const n=Math.max(1,Math.ceil(list.length/size)),p=Math.min(S.page[key]||1,n);S.page[key]=p;
 const pager=n<=1?(list.length?`<p class="muted small" style="margin-top:.8rem">${list.length} result${list.length>1?'s':''}</p>`:''):`<nav class="pager" aria-label="Pagination"><button class="btn sm" data-action="page" data-key="${key}" data-n="${p-1}" ${p<=1?'disabled':''}>Previous</button><span>Page ${p} of ${n}</span><button class="btn sm" data-action="page" data-key="${key}" data-n="${p+1}" ${p>=n?'disabled':''}>Next</button></nav>`;
 return {items:list.slice((p-1)*size,p*size),pager}}
function filterBar(ns,o){const f=S.f[ns];return `<div class="filters card" role="search">${o.q?`<label class="sr" for="q_${ns}">Search</label><input id="q_${ns}" type="search" placeholder="${o.q}" value="${esc(f.q)}" data-filter="${ns}" data-k="q">`:''}${(o.selects||[]).map(([k,all,opts])=>`<select aria-label="${all}" data-filter="${ns}" data-k="${k}"><option value="">${all}</option>${opts.map(x=>`<option ${f[k]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`).join('')}</div>`}

/* ---------- map + charts ---------- */
function pinSVG(x,y,color,title){return `<g class="pin" transform="translate(${x} ${y})"><title>${esc(title||'')}</title><path d="M0 0c-6-7-9-11-9-15a9 9 0 0118 0c0 4-3 8-9 15z" fill="${color}"/><circle cy="-15" r="3.5" fill="#fff"/></g>`}
const PCOL={Urgent:'#C2452F',High:'#E9A23B',Medium:'#0E7C86',Low:'#5A6580'};
function campusMap(o={}){const c=o.counts,max=c?Math.max(1,...Object.values(c)):1;
 const blocks=BLOCKS.map(b=>{const n=c?(c[b.id]||0):0;return `<g><rect class="blk" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="7"/>${c?`<rect class="heat" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="7" style="fill-opacity:${(.06+.5*n/max).toFixed(2)}"/>`:''}<text x="${b.x+9}" y="${b.y+19}" font-weight="600">${esc(b.name)}</text>${c?`<text class="sub" x="${b.x+9}" y="${b.y+36}">${n} complaint${n===1?'':'s'}</text>`:''}</g>`}).join('');
 const pins=(o.pins||[]).map(p=>pinSVG(p.x,p.y,PCOL[p.priority]||'#0E7C86',p.title)).join('');
 return `<svg class="campus ${o.pick?'pick':''}" viewBox="0 0 610 380" role="img" aria-label="Campus map" ${o.pick?'data-map="pick"':''}><path class="road" d="M0 130H610M0 250H610M205 0V130M430 250V380"/>${blocks}${pins}${o.pick?`<g id="pinPick" class="pin" style="display:none"><path d="M0 0c-6-7-9-11-9-15a9 9 0 0118 0c0 4-3 8-9 15z" fill="#C2452F"/><circle cy="-15" r="3.5" fill="#fff"/></g>`:''}</svg>`}
function lineChart(vals,labels){const W=560,H=220,L=32,R=12,T=14,B=30,mx=Math.max(4,Math.ceil(Math.max(...vals)/4)*4);
 const x=i=>L+i*(W-L-R)/(vals.length-1),y=v=>T+(H-T-B)*(1-v/mx);
 const line=vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
 let g='';for(let t=0;t<=4;t++){const v=mx/4*t,yy=y(v);g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${Math.round(v)}</text>`}
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Complaints per week: ${vals.join(', ')}">${g}<path class="ar" d="${line}L${x(vals.length-1)} ${H-B}L${x(0)} ${H-B}Z"/><path class="ln" d="${line}"/>${vals.map((v,i)=>`<circle class="pt" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4"><title>${labels[i]}: ${v}</title></circle>`).join('')}${labels.map((l,i)=>i%2===0?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${l}</text>`:'').join('')}</svg>`}
function donut(a,b,la,lb){const t=a+b||1,r=52,C=2*Math.PI*r,da=C*a/t;
 return `<svg class="chart" style="max-width:220px;margin:0 auto" viewBox="0 0 140 140" role="img" aria-label="${la} ${a}, ${lb} ${b}"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--amber)" stroke-width="20"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--brand)" stroke-width="20" stroke-dasharray="${da} ${C-da}" transform="rotate(-90 70 70)"/><text x="70" y="68" text-anchor="middle" style="font-size:22px;font-weight:700;fill:var(--ink)">${a+b}</text><text x="70" y="86" text-anchor="middle">items</text></svg>`}
const hbars=(rows,unit)=>{const m=Math.max(.1,...rows.map(r=>r[1]));return rows.map(r=>`<div class="hbar"><span>${esc(r[0])}</span><div class="track"><i style="width:${(r[1]/m*100).toFixed(0)}%"></i></div><b>${r[1].toFixed(1)}${unit||''}</b></div>`).join('')};

function authShell(inner){
 const pins=[[110,70,'High'],[330,100,'Urgent'],[500,200,'Medium'],[160,300,'Medium']].map(p=>pinSVG(p[0],p[1],PCOL[p[2]],'')).join('');

${S.demo?`<div class="demo"><p>Demo accounts (password: campus123)</p><div class="row">${ROLES.map(r=>`<button class="btn sm" data-action="quick" data-role="${r}">${cap(r)}</button>`).join('')}</div></div>`:''}

<button class="btn primary block">Create account</button></form>

<div class="alt"><a href="#/login">Back to sign in</a></div>`)}

/* ---------- views: dashboards ---------- */
const cRow=(c,base)=>`<li><div><a class="t" href="#/${base||'complaints'}/${c.id}">${esc(c.title)}</a><br><small>${c.id} · ${esc(blockName(c.block))} · ${rel(c.created)}</small></div><div class="row">${bd(c.priority)}${bd(c.status)}</div></li>`;
function pDashboard(){return ({student:dashUser,staff:dashUser,technician:dashTech,admin:dashAdmin})[S.user.role]()}
function dashUser(){const u=S.user,mine=complaints.filter(c=>c.by===u.id),open=mine.filter(c=>!closed(c));
 const myLostIds=lost.filter(l=>l.by===u.id).map(l=>l.id),mm=computeMatches().filter(m=>myLostIds.includes(m.l.id)&&decision(m)!=='rejected');
 const campusOpen=complaints.filter(c=>!closed(c)).length;
 return head('Hello, '+u.name.split(' ')[0],'Here is where your reports stand.',`<a class="btn primary" href="#/complaints/new">${ico('plus')}Report an issue</a><a class="btn" href="#/lost/new">Report lost item</a>`)+
 `<div class="grid g4">${stat('Your open complaints',open.length,'Still being worked on')}${stat('Resolved for you',mine.length-open.length,'Fixed or closed','good')}${stat('Lost item reports',myLostIds.length,'You filed')}${stat('Possible matches',mm.length,'For your lost items')}${u.role==='staff'?stat('Campus open issues',campusOpen,'Across all blocks'):''}</div>
 <div class="grid g2 sect"><section class="card"><h2>Your recent complaints</h2>${mine.length?`<ul class="list">${mine.slice(0,5).map(c=>cRow(c)).join('')}</ul>`:empty('No complaints yet','When something is broken on campus, report it here.',`<a class="btn primary" href="#/complaints/new">Report an issue</a>`)}</section>
 <section class="card"><h2>Matches for your lost items</h2>${mm.length?`<ul class="list">${mm.slice(0,4).map(m=>`<li><div><b>${esc(m.l.title)}</b><br><small>May be: ${esc(m.f.title)} (kept at ${esc(m.f.kept)})</small></div><a class="btn sm" href="#/claim/${m.f.id}">Claim</a></li>`).join('')}</ul>`:empty('No matches yet','We compare every new found item against your reports automatically.')}</section></div>`}
function dashTech(){const u=S.user,mine=complaints.filter(c=>c.tech===u.id),act=mine.filter(c=>!closed(c)).sort((a,b)=>PRIORITIES.indexOf(b.priority)-PRIORITIES.indexOf(a.priority)),done=mine.filter(closed);
 return head('Hello, '+u.name.split(' ')[0],'Your queue, highest priority first.',`<a class="btn primary" href="#/tasks">${ico('wrench')}All my tasks</a>`)+
 `<div class="grid g4">${stat('Active tasks',act.length,'Assigned to you')}${stat('In progress',act.filter(c=>c.status==='In Progress').length,'Currently underway')}${stat('Urgent or high',act.filter(c=>c.priority==='Urgent'||c.priority==='High').length,'Do these first',act.some(c=>c.priority==='Urgent')?'warn':'')}${stat('Completed',done.length,'Avg '+avg(done.map(resDays).filter(x=>x!=null)).toFixed(1)+' days','good')}</div>
 <section class="card sect"><h2>Next up</h2>${act.length?`<ul class="list">${act.slice(0,6).map(c=>cRow(c,'tasks')).join('')}</ul>`:empty('All clear','Nothing is assigned to you right now.')}</section>`}
function dashAdmin(){const open=complaints.filter(c=>!closed(c)),uns=complaints.filter(c=>c.status==='Submitted'),rd=complaints.map(resDays).filter(x=>x!=null);
 const counts={};complaints.forEach(c=>counts[c.block]=(counts[c.block]||0)+1);const pend=computeMatches().filter(m=>decision(m)==='pending').length;
 return head('Campus overview','Live view of complaints, dispatch and lost-and-found.',`<a class="btn primary" href="#/dispatch">${ico('wrench')}Open dispatch</a><a class="btn" href="#/analytics">${ico('chart')}Analytics</a>`)+
 `<div class="grid g4">${stat('Total complaints',complaints.length,'Last 8 weeks')}${stat('Open now',open.length,'Not yet resolved')}${stat('Awaiting dispatch',uns.length,'Need a technician',uns.length?'warn':'good')}${stat('Avg resolution',avg(rd).toFixed(1)+'d','Submitted to resolved')}${stat('Matches to review',pend,'Lost and found pairs')}</div>
 <div class="grid g2 sect"><section class="card"><h2>Where problems cluster</h2><p class="muted small" style="margin:.2rem 0 .7rem">Darker blocks have more complaints.</p>${campusMap({counts})}<div class="legend">Fewer<i></i>More</div></section>
 <section class="card"><h2>Needs a technician</h2>${uns.length?`<ul class="list">${uns.slice(0,6).map(c=>cRow(c)).join('')}</ul><div style="margin-top:.8rem"><a class="btn sm" href="#/dispatch">Assign now</a></div>`:empty('Everything is assigned','New complaints will appear here.')}</section></div>`}

/* ---------- views: complaints ---------- */
function pComplaints(scope){const mine=scope==='mine',ns=mine?'mine':'complaints';
 S.results=()=>{const f=S.f[ns],q=f.q.toLowerCase();
  const arr=complaints.filter(c=>(!mine||c.by===S.user.id)&&(!f.status||c.status===f.status)&&(!f.priority||c.priority===f.priority)&&(!f.category||c.category===f.category)&&(!q||(c.title+' '+c.id+' '+blockName(c.block)).toLowerCase().includes(q)));
  if(!arr.length)return empty('No complaints match','Try clearing a filter, or report a new issue.',`<a class="btn primary" href="#/complaints/new">Report an issue</a>`);

  filterBar(ns,{q:'Search by title, ID or block',selects:[['status','All statuses',STATUSES],['priority','All priorities',PRIORITIES],['category','All categories',S.cats]]})+`<div id="results">${S.results()}</div>`}

 `<form class="card" data-form="complaint" novalidate><div class="two">${fld('title','Issue title','text',{ph:'e.g. Tube light flickering in Lab 3'})}${sel('category','Category',S.cats,'','Select a category')}</div>

 ${ta('desc','Description','What happened, and since when?')}
 <div class="field"><span>Location: click the map or pick a block</span>${campusMap({pick:true})}<div class="two" style="margin-top:.6rem"><label><select name="block" aria-label="Block" style="width:100%;padding:.55rem;border:1px solid var(--line);border-radius:9px;background:var(--surface)"><option value="">Select a block</option>${BLOCKS.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></label><span class="muted small" id="blockName" style="align-self:center">No location chosen yet</span></div><input type="hidden" name="x"><input type="hidden" name="y"><small class="err" data-err="block" role="alert"></small></div>
 <div class="row"><button class="btn primary">${ico('send')}Submit complaint</button><a class="btn" href="#/complaints/mine">Cancel</a></div></form>`}
function pComplaint(p){const c=complaints.find(x=>x.id===p.id);if(!c)return empty('Complaint not found','It may have been removed.',`<a class="btn" href="#/complaints">Back to complaints</a>`);
 const u=S.user,idx=STATUSES.indexOf(c.status),tech=users.find(x=>x.id===c.tech);
 const tl=STATUSES.map((s,i)=>{const h=c.history.find(x=>x.status===s);return `<li class="${i<idx?'done':i===idx?'now':''}"><span class="node">${i<idx?ico('check'):''}</span><b>${s}</b><small>${h?fmtDate(h.at):'Pending'}</small></li>`}).join('');
 let act='';
 if(u.role==='admin'&&(c.status==='Submitted'||c.status==='Assigned'))act+=`<div class="row"><select data-assign="${c.id}" aria-label="Technician" style="padding:.5rem;border:1px solid var(--line);border-radius:9px;background:var(--surface)">${techOpts(c)}</select><button class="btn primary" data-action="assign" data-id="${c.id}">${c.tech?'Reassign':'Assign technician'}</button></div>`;
 if(u.role==='technician'&&c.tech===u.id&&c.status==='Assigned')act+=`<button class="btn primary" data-action="set-status" data-id="${c.id}" data-s="In Progress">Start work</button>`;
 if(u.role==='technician'&&c.tech===u.id&&c.status==='In Progress')act+=`<button class="btn primary" data-action="set-status" data-id="${c.id}" data-s="Resolved">${ico('check')}Mark resolved</button>`;
 if(c.status==='Resolved'&&(c.by===u.id||u.role==='admin'))act+=`<button class="btn primary" data-action="set-status" data-id="${c.id}" data-s="Closed">Confirm fixed and close</button>`;
 const canNote=u.role==='admin'||(u.role==='technician'&&c.tech===u.id);
 return head(c.title,c.id+' · raised '+fmtDate(c.created)+' by '+uname(c.by),`${bd(c.priority)}${bd(c.status)}`)+
 `<section class="card"><h2 style="margin-bottom:1rem">Progress</h2><ol class="tl">${tl}</ol>${act?`<div style="margin-top:1.2rem">${act}</div>`:''}</section>
 <div class="grid g2 sect"><section class="card"><h2 style="margin-bottom:.8rem">Details</h2><dl class="kv"><dt>Category</dt><dd>${esc(c.category)}</dd><dt>Location</dt><dd>${esc(blockName(c.block))}</dd><dt>Technician</dt><dd>${tech?esc(tech.name)+' ('+esc(tech.spec)+')':'Not assigned yet'}</dd><dt>Description</dt><dd>${esc(c.desc)}</dd></dl>${c.photos.length?`<div class="thumbs">${c.photos.map(s=>`<img src="${s}" alt="Photo attached to the complaint">`).join('')}</div>`:''}</section>

 return head(isL?'Report a lost item':'Report a found item',isL?'The more detail you add, the better the automatic matching works.':'Tell us where you found it and where it is being kept.')+

 const u=S.user,ms=computeMatches().filter(m=>(isL?m.l.id===i.id:m.f.id===i.id)&&decision(m)!=='rejected');let act='';

const common=[['notifications','Notifications','bell'],['profile','Profile','user']];
const NAV={
 student:[['',[['dashboard','Dashboard','home']]],['Infrastructure',[['complaints/new','Report an issue','plus'],['complaints/mine','My complaints','list']]],['Lost and found',[['lost','Lost items','search'],['found','Found items','box'],['lost/new','Report lost item','alert'],['found/new','Report found item','check'],['matches','My matches','tag']]],['Account',common]],
 staff:[['',[['dashboard','Dashboard','home']]],['Infrastructure',[['complaints/new','Report an issue','plus'],['complaints/mine','My complaints','list'],['complaints','All complaints','layers']]],['Lost and found',[['lost','Lost items','search'],['found','Found items','box'],['lost/new','Report lost item','alert'],['found/new','Report found item','check'],['matches','Match suggestions','tag']]],['Account',common]],
 technician:[['',[['dashboard','Dashboard','home']]],['Maintenance',[['tasks','Assigned tasks','wrench'],['history','Work history','list']]],['Account',common]],

const R=(pat,title,roles,fn,pub)=>({pat:pat.split('/'),title,roles,fn,pub});
const ROUTES=[
 R('login','Sign in',[],pLogin,1),R('register','Create account',[],pRegister,1),R('forgot','Reset password',[],pForgot,1),
 R('dashboard','Dashboard',[],pDashboard),
 R('complaints/new','Report an issue',['student','staff'],pNewComplaint),R('complaints/mine','My complaints',['student','staff'],()=>pComplaints('mine')),
 R('complaints','All complaints',['staff','admin'],()=>pComplaints('all')),R('complaints/:id','Complaint',[],pComplaint),

 R('lost/new','Report lost item',['student','staff'],()=>pReportItem('lost')),R('found/new','Report found item',['student','staff'],()=>pReportItem('found')),
 R('items/:type/:id','Item details',['student','staff','admin'],pItem),R('claim/:id','Claim item',['student','staff'],pClaim),

 R('categories','Categories',['admin'],pCategories),R('reports','Reports',['admin'],pReports),

function match(seg){for(const r of ROUTES){if(r.pat.length!==seg.length)continue;const p={};let ok=true;r.pat.forEach((s,i)=>{if(s[0]===':')p[s.slice(1)]=decodeURIComponent(seg[i]);else if(s!==seg[i])ok=false});if(ok)return {r,p}}return null}
const app=$('#app');let navToken=0;
function activeKey(path){const s=path.split('/');if(s[0]==='complaints'&&s.length===2&&s[1]!=='new'&&s[1]!=='mine')return S.user.role==='admin'?'complaints':'complaints/mine';if(s[0]==='items')return s[1];if(s[0]==='claim')return 'found';if(s[0]==='tasks'&&s[1])return 'tasks';return path}
function route(){
 const seg=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);if(!seg.length)seg.push(S.user?'dashboard':'login');
 const m=match(seg);
 if(!S.user&&!(m&&m.r.pub)){location.hash='#/login';return}
 if(S.user&&m&&m.r.pub){location.hash='#/dashboard';return}
 if(m&&m.r.roles.length&&!m.r.roles.includes(S.user.role)){toast('That page is not available for your role.','warn');location.hash='#/dashboard';return}
 const tok=++navToken;S.cur=null;S.bell=false;
 if(m&&m.r.pub){app.dataset.uid='';app.innerHTML=m.r.fn(m.p);window.scrollTo(0,0);return}
 if(!$('#main')||app.dataset.uid!==S.user.id){renderShell();app.dataset.uid=S.user.id}
 const path=seg.join('/'),title=m?m.r.title:'Not found';
 updateChrome(path,title);const main=$('#main');main.innerHTML=loader();
 setTimeout(()=>{if(tok!==navToken)return;S.cur=m?{fn:m.r.fn,p:m.p}:{fn:p404,p:{}};render();window.scrollTo(0,0);main.focus({preventScroll:true})},280)}
function render(){const main=$('#main');if(!main||!S.cur)return;try{main.innerHTML=S.cur.fn(S.cur.p)}catch(e){console.error(e);main.innerHTML=empty('Something went wrong','This page could not be displayed.',`<button class="btn primary" data-action="retry">Try again</button>`)}afterRender()}
function afterRender(){const pv=$('#photoPrev');if(pv)drawPhotos()}
const refresh=()=>{const r=$('#results');if(r&&S.results)r.innerHTML=S.results()};
function renderShell(){const u=S.user;
 app.innerHTML=`<div class="shell"><aside class="side" id="side" aria-label="Main navigation"><div class="brand"><span class="mark">${ico('layers')}</span>Smart Campus</div>${NAV[u.role].map(g=>`${g[0]?`<h4>${g[0]}</h4>`:''}${g[1].map(i=>`<a class="nav" href="#/${i[0]}" data-nav="${i[0]}">${ico(i[2])}<span>${i[1]}</span></a>`).join('')}`).join('')}<div class="side-foot"><span class="avatar">${esc(u.name.split(' ').map(w=>w[0]).join('').slice(0,2))}</span><div><b>${esc(u.name)}</b><small>${cap(u.role)}</small></div></div></aside><div class="scrim" data-action="nav-close"></div>
 <div class="content"><header class="top"><button class="icon-btn menu" data-action="nav-toggle" aria-label="Open menu">${ico('menu')}</button><div class="crumb">Smart Campus / <b id="crumb"></b></div><div class="grow"></div><button class="icon-btn" data-action="theme" aria-label="Toggle light or dark theme">${ico('moon')}</button><div class="bell-wrap" id="bellWrap">${bellHTML()}</div><button class="icon-btn" data-action="logout" aria-label="Sign out">${ico('logout')}</button></header><main id="main" tabindex="-1"></main></div></div>`}
function updateChrome(path,title){const k=activeKey(path);document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===k)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});const c=$('#crumb');if(c)c.textContent=title;closeNav();document.title=title+' · Smart Campus'}
const closeNav=()=>{const s=$('#side');if(s)s.classList.remove('open');const sc=$('.scrim');if(sc)sc.classList.remove('show')};
function bellHTML(){const n=S.notifs.filter(x=>!x.read).length;
 return `<button class="icon-btn" data-action="bell" aria-label="Notifications, ${n} unread" aria-expanded="${S.bell}">${ico('bell')}${n?`<span class="dot">${n>9?'9+':n}</span>`:''}</button>${S.bell?`<div class="drop"><header><b>Notifications</b><button class="btn sm" data-action="mark-all">Mark all read</button></header>${S.notifs.length?S.notifs.slice(0,5).map(x=>`<a class="n-item ${x.read?'':'unread'}" href="${x.link}" data-action="read-notif" data-id="${x.id}">${esc(x.text)}<br><small>${rel(x.at)}</small></a>`).join(''):'<p class="muted" style="padding:1rem">No notifications yet.</p>'}<footer><a href="#/notifications" data-action="bell">See all notifications</a></footer></div>`:''}`}
function updateBell(){const w=$('#bellWrap');if(w)w.innerHTML=bellHTML()}

/* ---------- API, session, theme ---------- */
async function api(method,path,body){
 const t=store.get('sc_token',null);let r;
 try{r=await fetch('/api'+path,{method,headers:Object.assign({'Content-Type':'application/json'},t?{Authorization:'Bearer '+t}:{}),body:body===undefined?undefined:JSON.stringify(body)})}
 catch(e){throw new Error('Cannot reach the server. Make sure it is running (npm start).')}
 let d={};try{d=await r.json()}catch(e){}
 if(r.status===401&&t&&path!=='/auth/login'){signOut();throw new Error(d.error||'Please sign in again')}
 if(!r.ok)throw new Error(d.error||'Something went wrong');return d}
const fill=(arr,s)=>{arr.length=0;arr.push(...s)};
let lastNid=0;
function setNotifs(list,announce){S.notifs=list;if(announce)list.filter(n=>n.id>lastNid&&!n.read).slice(0,3).forEach(n=>toast(n.text));lastNid=Math.max(lastNid,0,...list.map(n=>n.id));updateBell()}
async function load(){const d=await api('GET','/bootstrap');S.user=d.me;fill(users,d.users);fill(complaints,d.complaints);fill(lost,d.lost);fill(found,d.found);S.cats=d.categories;S.decisions=d.decisions;S.matches=d.matches;setNotifs(d.notifications)}
let poll=null;
function startPoll(){stopPoll();poll=setInterval(async()=>{try{const d=await api('GET','/notifications');setNotifs(d.notifications,true)}catch(e){}},20000)}
function stopPoll(){if(poll){clearInterval(poll);poll=null}}
async function run(fn,okMsg){try{await fn();await load();if(okMsg)toast(okMsg,'ok')}catch(e){toast(e.message,'bad')}if(S.cur)render()}
async function signIn(token,user){store.set('sc_token',token);S.user=user;try{await load()}catch(e){}startPoll();if(location.hash==='#/dashboard')route();else location.hash='#/dashboard'}
function signOut(){store.del('sc_token');S.user=null;fill(users,[]);fill(complaints,[]);fill(lost,[]);fill(found,[]);S.notifs=[];S.matches=[];lastNid=0;stopPoll();app.dataset.uid='';if(location.hash==='#/login')route();else location.hash='#/login'}
function applyTheme(t){if(t)document.documentElement.setAttribute('data-theme',t)}
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=cur==='dark'?'light':'dark';applyTheme(n);store.set('sc_theme',n)}

/* ---------- forms ---------- */
const rq=m=>v=>v?'':m,mn=(n,l)=>v=>v.length>=n?'':l+' needs at least '+n+' characters',em=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)?'':'Enter a valid email address, like you@campus.edu';
function check(f,rules){let ok=true,first=null;f.querySelectorAll('[data-err]').forEach(e=>e.textContent='');
 for(const k in rules){const el=f.elements[k],v=(el?el.value:'').trim(),m=rules[k](v,f);if(m){ok=false;const e=f.querySelector('[data-err="'+k+'"]');if(e)e.textContent=m;if(el&&el.setAttribute){el.setAttribute('aria-invalid','true');if(el.type!=='hidden')first=first||el}}else if(el&&el.removeAttribute)el.removeAttribute('aria-invalid')}
 if(first)first.focus();return ok}
const val=(f,k)=>(f.elements[k]?f.elements[k].value:'').trim();
const FORMS={
 async login(f){if(!check(f,{email:v=>rq('Enter your email')(v)||em(v),password:rq('Enter your password')}))return;
  try{const d=await api('POST','/auth/login',{email:val(f,'email'),password:f.elements.password.value});await signIn(d.token,d.user)}catch(e){toast(e.message,'bad')}},
 async register(f){if(!check(f,{name:mn(2,'Name'),email:v=>rq('Enter your email')(v)||em(v),password:mn(8,'Password'),confirm:(v,f)=>v===f.elements.password.value?'':'Passwords do not match'}))return;
  try{const d=await api('POST','/auth/register',{name:val(f,'name'),email:val(f,'email'),password:f.elements.password.value});await signIn(d.token,d.user)}catch(e){toast(e.message,'bad')}},
 async forgot(f){if(!check(f,{email:v=>rq('Enter your email')(v)||em(v)}))return;
  try{await api('POST','/auth/forgot',{email:val(f,'email')});$('#forgotMsg').innerHTML=`<div class="note" style="margin-top:1rem">Request sent for <b>${esc(val(f,'email'))}</b>. If the account exists, an administrator has been notified and will give you a temporary password.</div>`}catch(e){toast(e.message,'bad')}},
 async complaint(f){if(!check(f,{title:mn(5,'Title'),category:rq('Choose a category'),desc:mn(15,'Description'),block:rq('Pick a block or click the map to set the location')}))return;
  try{const d=await api('POST','/complaints',{title:val(f,'title'),category:val(f,'category'),priority:val(f,'priority'),desc:val(f,'desc'),block:val(f,'block'),x:+val(f,'x'),y:+val(f,'y'),photos:S.photos});
   await load();toast('Complaint '+d.id+' submitted. We will assign a technician soon.','ok');location.hash='#/complaints/'+d.id}catch(e){toast(e.message,'bad')}},
 async item(f){const type=f.dataset.type;if(!check(f,{title:mn(3,'Item name'),category:rq('Choose a category'),place:rq('Select a block'),date:rq('Choose a date'),desc:mn(10,'Description')}))return;
  try{const d=await api('POST','/'+type,{title:val(f,'title'),category:val(f,'category'),place:val(f,'place'),date:val(f,'date'),desc:val(f,'desc'),kept:val(f,'kept')});
   await load();toast((type==='lost'?'Lost':'Found')+' item reported.','ok');location.hash='#/items/'+type+'/'+d.id}catch(e){toast(e.message,'bad')}},
 async claim(f){if(!check(f,{proof:mn(15,'Proof of ownership'),phone:v=>/^[0-9+\s-]{10,14}$/.test(v)?'':'Enter a valid phone number'}))return;
  const id=val(f,'id');try{await api('POST','/found/'+id+'/claim',{proof:val(f,'proof'),phone:val(f,'phone')});await load();toast('Claim submitted. Staff will review it.','ok');location.hash='#/items/found/'+id}catch(e){toast(e.message,'bad')}},
 note(f){if(!check(f,{text:mn(3,'Note')}))return;return run(()=>api('POST','/complaints/'+val(f,'id')+'/notes',{text:val(f,'text')}),'Note added')},
 async profile(f){if(!check(f,{name:mn(2,'Name'),phone:v=>!v||/^[0-9+\s-]{10,14}$/.test(v)?'':'Enter a valid phone number'}))return;
  try{await api('PATCH','/me',{name:val(f,'name'),phone:val(f,'phone')});await load();app.dataset.uid='';toast('Profile saved','ok');route()}catch(e){toast(e.message,'bad')}},
 async adduser(f){if(!check(f,{name:mn(2,'Name'),email:v=>rq('Enter an email')(v)||em(v)}))return;
  try{const r=await api('POST','/users',{name:val(f,'name'),email:val(f,'email'),role:val(f,'role')});await load();
   openModal('User created',`<p>Share this temporary password with ${esc(val(f,'name'))}. They can sign in with it right away.</p><p style="margin:1rem 0"><b style="font-size:1.2rem">${esc(r.tempPassword)}</b></p><button class="btn" data-action="modal-close">Done</button>`);render()}catch(e){toast(e.message,'bad')}},
 addcat(f){if(!check(f,{name:v=>mn(3,'Category name')(v)||(S.cats.some(c=>c.toLowerCase()===v.toLowerCase())?'That category already exists':'')}))return;return run(()=>api('POST','/categories',{name:val(f,'name')}),'Category added')}};

/* ---------- event wiring ---------- */
function drawPhotos(){const pv=$('#photoPrev');if(pv)pv.innerHTML=S.photos.map((s,i)=>`<div><img src="${s}" alt="Photo ${i+1} preview"><button type="button" data-action="clear-photo" data-i="${i}" aria-label="Remove photo ${i+1}">×</button></div>`).join('')}
function setPin(f,x,y,b){f.elements.x.value=Math.round(x);f.elements.y.value=Math.round(y);f.elements.block.value=b;const g=$('#pinPick');g.style.display='';g.setAttribute('transform','translate('+x+' '+y+')');$('#blockName').textContent=blockName(b)}
function pickMap(svg,e){const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*610,y=(e.clientY-r.top)/r.height*380;
 let b=BLOCKS.find(k=>x>=k.x&&x<=k.x+k.w&&y>=k.y&&y<=k.y+k.h);if(!b)b=BLOCKS.slice().sort((a,c)=>Math.hypot(x-a.x-a.w/2,y-a.y-a.h/2)-Math.hypot(x-c.x-c.w/2,y-c.y-c.h/2))[0];
 setPin(svg.closest('form'),x,y,b.id)}
const DEMO_EMAIL={student:'nikish@campus.edu',staff:'meera@campus.edu',technician:'ravi@campus.edu',admin:'priya@campus.edu'};
const ACT={
 quick:async d=>{try{const r=await api('POST','/auth/login',{email:DEMO_EMAIL[d.role],password:'campus123'});await signIn(r.token,r.user)}catch(e){toast(e.message,'bad')}},
 logout:()=>signOut(),theme:toggleTheme,retry:()=>route(),
 'nav-toggle':()=>{$('#side').classList.toggle('open');$('.scrim').classList.toggle('show')},'nav-close':closeNav,
 bell:()=>{S.bell=!S.bell;updateBell()},
 'read-notif':d=>{const n=S.notifs.find(x=>x.id==d.id);if(n&&!n.read){n.read=true;api('POST','/notifications/read',{id:n.id}).catch(()=>{})}S.bell=false;updateBell()},
 'mark-all':()=>{S.notifs.forEach(n=>n.read=true);updateBell();api('POST','/notifications/read',{all:true}).catch(()=>{});if(S.results&&$('#results'))refresh()},
 'toggle-unread':()=>{S.f.notifs.unread=S.f.notifs.unread?'':'1';render()},
 page:d=>{S.page[d.key]=+d.n;refresh()},tab:d=>{S.f.matches.tab=d.tab;render()},
 decide:d=>run(()=>api('POST','/matches/decide',{key:d.key,value:d.v}),d.v==='approved'?'Match approved. Both people were notified.':'Match rejected'),
 assign:d=>{const s=document.querySelector('[data-assign="'+d.id+'"]');return run(()=>api('POST','/complaints/'+d.id+'/assign',{techId:s.value}),'Technician assigned')},
 'set-status':d=>run(()=>api('POST','/complaints/'+d.id+'/status',{status:d.s}),'Status updated to '+d.s),
 recovered:d=>run(()=>api('POST','/lost/'+d.id+'/recover'),'Marked as recovered. Glad you got it back.'),
 returned:d=>run(()=>api('POST','/found/'+d.id+'/return'),'Item marked as returned'),
 'toggle-user':d=>{const u=users.find(x=>x.id===d.id);return run(()=>api('PATCH','/users/'+d.id,{active:!u.active}),u.active?'User deactivated':'User activated')},
 'reset-pw':async d=>{try{const r=await api('POST','/users/'+d.id+'/reset-password');openModal('Temporary password',`<p>Share this with the user. It replaces their old password.</p><p style="margin:1rem 0"><b style="font-size:1.2rem">${esc(r.tempPassword)}</b></p><button class="btn" data-action="modal-close">Done</button>`)}catch(e){toast(e.message,'bad')}},
 'remove-cat':d=>run(()=>api('DELETE','/categories/'+encodeURIComponent(d.name)),'Category removed'),
 'add-user':()=>openModal('Add user',`<form data-form="adduser" novalidate>${fld('name','Full name','text')}${fld('email','Email','email')}<label class="field"><span>Role</span><select name="role">${roleOpts}</select></label><button class="btn primary">Add user</button></form>`),
 'modal-close':closeModal,
 csv:async()=>{const rows=[['ID','Title','Category','Block','Priority','Status','Raised','Days to resolve']].concat(complaints.map(c=>[c.id,c.title,c.category,blockName(c.block),c.priority,c.status,fmtDate(c.created),resDays(c)!=null?resDays(c).toFixed(1):'']));
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  try{await navigator.clipboard.writeText(csv);toast('CSV copied to clipboard','ok')}catch(e){openModal('Copy CSV','<p class="muted" style="margin-bottom:.6rem">Select all and copy:</p><textarea readonly>'+esc(csv)+'</textarea>')}},
 'clear-photo':d=>{S.photos.splice(+d.i,1);drawPhotos()}};
document.addEventListener('click',e=>{
 if(S.bell&&!e.target.closest('.bell-wrap')){S.bell=false;updateBell()}
 const mp=e.target.closest('[data-map="pick"]');if(mp){pickMap(mp,e);return}
 const a=e.target.closest('[data-action]');if(!a)return;const act=a.dataset.action;
 if(act==='modal-bg'){if(e.target===a)closeModal();return}
 if(ACT[act])ACT[act](a.dataset,a)});
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();if(f.dataset.busy)return;f.dataset.busy='1';try{await FORMS[f.dataset.form](f)}finally{delete f.dataset.busy}});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-filter]')){S.f[t.dataset.filter][t.dataset.k]=t.value;S.page[t.dataset.filter]=1;refresh()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.matches('[data-photos]')){[...t.files].slice(0,3-S.photos.length).forEach(fl=>{if(fl.size>2e6){toast(fl.name+' is over 2 MB and was skipped','warn');return}const r=new FileReader();r.onload=()=>{S.photos.push(r.result);drawPhotos()};r.readAsDataURL(fl)});t.value=''}
 else if(t.matches('[data-role-for]')){run(()=>api('PATCH','/users/'+t.dataset.roleFor,{role:t.value}),'Role updated')}
 else if(t.name==='block'&&t.closest('[data-form="complaint"]')){const b=BLOCKS.find(x=>x.id===t.value);if(b)setPin(t.closest('form'),b.x+b.w/2,b.y+b.h/2+10,b.id)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(S.bell){S.bell=false;updateBell()}closeNav()}});
window.addEventListener('hashchange',route);

/* ---------- boot ---------- */
applyTheme(store.get('sc_theme',null));
(async function boot(){
 app.innerHTML=loader();
 try{const c=await (await fetch('/api/config')).json();S.demo=!!c.demo}catch(e){}
 if(store.get('sc_token',null)){try{await load();startPoll()}catch(e){store.del('sc_token');S.user=null}}
 route();
})();
})();
</script>
